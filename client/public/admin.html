<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 관리자</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
body { flex-direction:column; justify-content:flex-start; padding-top:40px; background-color:#f4f4f9; height:auto; }
h1 { color:#333; }
.container { background-color:#fff; color:#333; min-width:600px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
.room-header { border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.admin-timer-display { font-size:1.8em; font-weight:bold; color:#dc3545; border:2px solid #dc3545; padding:5px 10px; border-radius:8px; min-width:80px; text-align:center; background-color:#fff8f8; }
.room h2,.room h3 { color:#333; }
.room h3 { margin-top:0; border-bottom:1px solid #eee; padding-bottom:5px; }
.room li { background-color:#e9e9e9; color:#333; display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:4px; margin-bottom:5px; }
.room li.dead { color:#999; background-color:#ddd; text-decoration:line-through; }
.eliminate-btn,.revive-btn { padding:5px 10px; border:none; border-radius:4px; cursor:pointer; font-size:.9em; color:white; }
.eliminate-btn { background-color:#dc3545; }
.revive-btn { background-color:#28a745; }
.start-game-btn,.next-phase-btn,.timer-btn,.trigger-alien-action-btn,.trigger-rampage-btn,.resolve-night-btn,.trigger-crew-action-btn,.end-night-btn,.start-nomination-btn,.start-ejection-minigame-btn,.resolve-ejection-minigame-btn,.meeting-timer-btn,.escape-timer-btn { width:100%; padding:10px; color:white; border:none; border-radius:5px; cursor:pointer; font-size:1em; margin-top:15px; }
.start-game-btn:disabled,.next-phase-btn:disabled,.timer-btn:disabled,.trigger-alien-action-btn:disabled,.resolve-night-btn:disabled,.start-nomination-btn:disabled,.start-ejection-minigame-btn:disabled,.resolve-ejection-minigame-btn:disabled,.meeting-timer-btn:disabled,.escape-timer-btn:disabled { background-color:#aaa; cursor:not-allowed; }
.start-game-btn { background-color:#28a745; }
.next-phase-btn { background-color:#007bff; }
.timer-btn,.meeting-timer-btn,.escape-timer-btn { background-color:#ffc107; color:#212529; }
.trigger-alien-action-btn,.trigger-rampage-btn { background-color:#6f42c1; }
.resolve-night-btn { background-color:#fd7e14; }
.trigger-crew-action-btn { background-color:#20c997; }
.end-night-btn { background-color:#6c757d; }
.role-settings,.preset-settings { margin-top:15px; border-top:1px solid #eee; padding-top:15px; }
.role-item { font-size:.9em; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.role-item span { font-weight:bold; }
.role-controls input { width:35px; padding:5px; }
.preset-select { width:100%; padding:8px; font-size:.9em; margin-top:5px; }
.role-summary,.phase-info { font-weight:bold; margin-top:10px; }
#reset-server-btn { width:auto; padding:8px 16px; font-size:.9em; margin-top:10px; background-color:#6c757d; }
.admin-log-box { border:1px solid #ccc; background-color:#f8f9fa; padding:10px; margin-top:15px; height:150px; overflow-y:auto; font-size:.9em; text-align:left; display:flex; flex-direction:column-reverse; }
.admin-log-box p { margin:2px 0; line-height:1.4; color:#333; }
.room li { align-items:flex-start; padding:12px; }
.player-info-container { line-height:1.5; }
.player-info-name { font-weight:bold; font-size:1.05em; color:#333; }
.player-info-group,.player-info-role { font-size:.9em; color:#555; }
.admin-log-box p.log-mission_buff,.admin-log-box p.log-phase_change { color:#b08000; font-weight:bold; background-color:#fffbe6; padding:4px 8px; border-radius:4px; }
.player-info-role.role-alien { color:#dc3545; font-weight:bold; }
.player-info-role.role-core-crew { color:#007bff; font-weight:bold; }
.player-info-role.role-special-crew { color:#28a745; font-weight:bold; }
.vote-status-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; list-style:none; padding:0; margin-top:10px; }
.vote-status-item { font-size:.9em; background-color:#f4f4f4; border:1px solid #ddd; padding:8px; border-radius:4px; }
.vote-status-item.voted { background-color:#e6ffed; border-color:#b8e6c3; }
.vote-status-item b { color:#0056b3; }
/* 현재 상태 뱃지 */
.phase-badge { display:inline-block; padding:6px 14px; border-radius:20px; font-weight:bold; font-size:.95em; margin-bottom:10px; }
.phase-badge.day    { background:#fff9c4; color:#5d4037; border:2px solid #f9a825; }
.phase-badge.night-alien { background:#1a0533; color:#ff6b6b; border:2px solid #7c3aed; font-size:.9em; }
.phase-badge.night-crew  { background:#1a0533; color:#fbbf24; border:2px solid #7c3aed; font-size:.9em; }
.phase-badge.escape { background:#002f1f; color:#34d399; border:2px solid #059669; }
.phase-badge.gameover { background:#3b0000; color:#fca5a5; border:2px solid #dc2626; }
/* 대기실 참가자 그리드 */
.waiting-player-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; list-style:none; padding:0; margin:0; }
.waiting-player-grid li { background:#e9e9e9; border-radius:6px; padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.9em; text-align:center; }
.waiting-player-grid .kick-btn { font-size:.75em; padding:2px 6px; }
/* 3단 컬럼 */
.col-players { flex:4; min-width:0; border-right:1px solid #eee; padding-right:14px; overflow:hidden; }
.col-game    { flex:3; min-width:0; border-right:1px solid #eee; padding-right:14px; padding-left:14px; overflow:hidden; }
.col-monitor { flex:3; min-width:0; padding-left:14px; overflow:hidden; }
.col-header  { font-size:1em; font-weight:bold; color:#444; border-bottom:2px solid #eee; padding-bottom:6px; margin-bottom:10px; }
/* 페이즈 상태 표시 */
.phase-badge { display:inline-block; padding:6px 14px; border-radius:20px; font-size:1em; font-weight:bold; letter-spacing:.5px; margin-bottom:8px; }
.phase-badge.day    { background:#fff9c4; color:#5c4400; border:2px solid #f9c000; }
.phase-badge.night-alien { background:#1a0030; color:#ff6b6b; border:2px solid #9b59b6; font-size:1.05em; }
.phase-badge.night-crew  { background:#1a0030; color:#ffd700; border:2px solid #9b59b6; }
.phase-badge.special{ background:#e3f2fd; color:#1565c0; border:2px solid #42a5f5; }
/* 진행 가이드 (하단 배치) */
.help-box { padding:10px 14px; border:1px solid #007bff; border-radius:6px; background:#f0f8ff; color:#333; margin-top:auto; font-size:.88em; }
/* 현재 상태 상황별 색상 박스 */
.phase-badge { display:inline-block; padding:6px 14px; border-radius:6px; font-weight:bold; font-size:1em; margin-bottom:8px; }
.phase-badge.day    { background:#fff3cd; color:#7a5c00; border:2px solid #ffc107; }
.phase-badge.night-alien { background:#1a0a2e; color:#ff4d6d; border:2px solid #9d174d; }
.phase-badge.night-crew  { background:#1a0a2e; color:#ffd60a; border:2px solid #6d28d9; }
.phase-badge.game-over   { background:#212529; color:#adb5bd; border:2px solid #495057; }
/* 탈출 역할 주장 현황 */
.claim-row { display:flex; align-items:center; justify-content:space-between; padding:5px 8px; border-radius:4px; margin-bottom:3px; font-size:.88em; background:#f4f4f4; border:1px solid #ddd; }
.claim-row.claimed { background:#e6ffed; border-color:#b8e6c3; }
.claim-role-badge { font-size:.8em; padding:2px 7px; border-radius:3px; background:#007bff; color:#fff; }
/* 아이콘 버튼 */
.status-icon-btn { font-size:1.3em; background:none; border:2px solid; border-radius:50%; padding:3px 8px; cursor:pointer; }
.status-icon-btn.alive { border-color:#28a745; }
/* 자동 진행 패널 */
.auto-panel { border:2px solid #20c997; border-radius:8px; padding:10px; margin-top:12px; background:#f0fff8; }
.auto-panel h5 { margin:0 0 8px; color:#20c997; }
.auto-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.auto-row input[type=checkbox] { width:18px; height:18px; }
.auto-times { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.auto-time-item { display:flex; flex-direction:column; font-size:.82em; }
.auto-time-item input { width:65px; padding:3px; margin-top:2px; }
.apply-auto-btn { background:#20c997; color:#fff; border:none; border-radius:4px; padding:5px 12px; cursor:pointer; font-size:.85em; width:100%; }
/* 모니터링 패널 */
.mg-row { display:flex; align-items:center; gap:8px; padding:6px; background:#ede7f6; border-radius:4px; margin-bottom:4px; font-size:.9em; }
.mg-card { font-weight:bold; padding:2px 8px; border-radius:3px; font-size:.82em; }
.mg-card.ejection { background:#dc3545; color:#fff; }
.mg-card.survival { background:#28a745; color:#fff; }
.mg-card.pending { background:#aaa; color:#fff; }
/* 자동 역할 배정 */
.auto-assign-panel { border:2px dashed #007bff; border-radius:8px; padding:10px; margin-bottom:10px; background:#f0f8ff; }
.auto-assign-panel h5 { margin:0 0 8px; color:#007bff; }
.auto-assign-row { display:flex; align-items:center; gap:8px; }
.auto-assign-row input { width:60px; padding:4px; }
.auto-assign-btn { background:#007bff; color:#fff; border:none; border-radius:4px; padding:5px 12px; cursor:pointer; font-size:.85em; }
.kick-btn { padding:4px 8px; border:none; border-radius:4px; cursor:pointer; font-size:.8em; color:#fff; background:#dc3545; }
</style>
</head>
<body>
<h1>에일리언 마피아 - 관리자 대시보드</h1>
<div id="create-room-container" class="container" style="min-width:600px;margin-bottom:20px;">
  <h3>새로운 게임방 생성</h3>
  <input type="text" id="new-room-code-input" placeholder="사용할 초대 코드를 입력하세요" style="width:60%;font-size:1em;padding:10px;">
  <button id="create-room-btn" style="width:auto;padding:10px 20px;font-size:1em;margin-left:10px;">방 생성</button>
</div>
<div id="game-rooms-container"></div>
<div id="server-reset-container" class="container" style="min-width:600px;margin-top:30px;background-color:#5e2f35;">
  <h3 style="color:#ffc107;">서버 전체 초기화</h3>
  <p style="font-size:.9em;color:#eee;">주의: 이 버튼을 누르면 현재 진행 중이거나 대기 중인 모든 게임방의 정보가 영구적으로 삭제됩니다.</p>
  <button id="reset-server-btn" style="background-color:#dc3545;color:white;">모든 게임 기록 삭제</button>
</div>
<script>
const socket = io();
const roomsContainer = document.getElementById('game-rooms-container');

document.getElementById('create-room-btn').addEventListener('click', function() {
  const inp = document.getElementById('new-room-code-input');
  const code = inp.value.trim();
  if (code) { socket.emit('createRoom', { code: code }); inp.value = ''; }
});
document.getElementById('reset-server-btn').addEventListener('click', function() {
  if (confirm('정말로 서버의 모든 게임 기록을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
    socket.emit('resetServer');
  }
});

const ALL_ROLES = ['에일리언 여왕','에일리언','에일리언 알','에일리언 주술사','함장','엔지니어','의사','경호원','초능력자','수다쟁이','뚱이','신의 사도','군인','일반 승객'];
const ALIENS = ['에일리언 여왕','에일리언','에일리언 알','에일리언 주술사'];
const CORE_CREW = ['함장','엔지니어'];
const SPECIAL_CREW = ['의사','경호원','초능력자','수다쟁이','군인','신의 사도'];

let gameRoomsState = {};
let presetsState = {};
let missionPresetsState = [];
// 탭 상태 저장

// 총원 기반 자동 역할 배정
function autoAssignRoles(total) {
  if (total < 4) return null;
  const counts = {};
  ALL_ROLES.forEach(function(r) { counts[r] = 0; });

  // ── 우선순위 배정 순서 ─────────────────────────────────
  // 1단계: 필수 4인 (항상 포함)
  const fixed = ['에일리언 여왕','함장','엔지니어','일반 승객'];
  fixed.forEach(function(r) { counts[r] = 1; });
  let remaining = total - 4;

  // 2단계: 우선순위 순서대로 1명씩 추가 (인원 허용 범위 내)
  const priority = [
    { role: '에일리언', max: total >= 25 ? 2 : 1 },
    { role: '수다쟁이', max: 1 },
    { role: '에일리언 알', max: 1 },
    { role: '초능력자', max: 1 },
    { role: '뚱이', max: 1 },
    { role: '신의 사도', max: 1 },
    { role: '에일리언 주술사', max: 1 },
    { role: '군인', max: 1 },
    { role: '의사', max: 4 },
    { role: '경호원', max: 1 }
  ];

  // 각 역할을 max까지 채우되 remaining 소진 시 중단
  priority.forEach(function(item) {
    if (remaining <= 0) return;
    // 에일리언은 max까지 한 번에
    if (item.max > 1) {
      const add = Math.min(item.max, remaining);
      counts[item.role] = add;
      remaining -= add;
    } else {
      counts[item.role] = 1;
      remaining--;
    }
  });

  // 3단계: 모든 특수 역할 채운 후 → 일반승객/의사 번갈아, 의사 상한 4명
  let doctorCount = counts['의사'] || 0;
  let toggle = true; // true=일반승객, false=의사
  while (remaining > 0) {
    if (!toggle && doctorCount < 4) {
      counts['의사'] = (counts['의사'] || 0) + 1;
      doctorCount++;
    } else {
      counts['일반 승객'] = (counts['일반 승객'] || 0) + 1;
    }
    toggle = !toggle;
    remaining--;
  }

  return counts;
}

function getDefaultRoleCounts() {
  const counts = {};
  ALL_ROLES.forEach(function(r) { counts[r] = 0; });
  return counts;
}

socket.on('connect', function() { socket.emit('adminConnect'); });
socket.on('updateAdmin', function(data) {
  gameRoomsState = data.rooms;
  presetsState = data.presets || {};
  missionPresetsState = data.missionPresets || [];
  renderAdminView();
});

socket.on('confirmForceEject', function(data) {
  const { playerIds, playerNames } = data;
  const roomDiv = document.querySelector('.room');
  if (!roomDiv) return;
  const roomCode = roomDiv.dataset.code;
  if (confirm('[' + playerNames + '] 님이 카드를 선택하지 않았습니다. 이들을 즉시 방출시키겠습니까?')) {
    socket.emit('forceEjectPlayers', { roomCode: roomCode, playerIds: playerIds });
  }
});
socket.on('adminError', function(msg) { alert(msg); });
socket.on('crisisRouletteResult', function(data) {
  const roomDiv = document.querySelector('.room[data-code="' + data.roomCode + '"]');
  if (!roomDiv) return;
  const disp = roomDiv.querySelector('.crisis-display');
  if (disp) {
    disp.innerHTML = '<div class="crisis-roulette-result-text">' + data.result + '</div>';
    disp.style.display = 'block';
    setTimeout(function() {
      disp.style.display = 'none';
      const rb = roomDiv.querySelector('.resolve-escape-step-btn');
      if (rb) rb.disabled = false;
    }, 2500);
  }
});

// ── timerUpdate ────────────────────────────────────────────────────────
socket.on('timerUpdate', function(data) {
  const { roomCode, timeLeft } = data;
  const td = document.getElementById('timer-display-' + roomCode);
  if (td) {
    if (timeLeft >= 0) {
      const m = Math.floor(timeLeft / 60);
      const s = (timeLeft % 60).toString().padStart(2, '0');
      td.textContent = m + ':' + s;
    } else {
      td.textContent = '종료!';
    }
  }
  // 에일리언 타이머 표시 업데이트
  const alienTD = document.getElementById('alien-timer-display-' + roomCode);
  if (alienTD && timeLeft >= 0) {
    const m2 = Math.floor(timeLeft / 60);
    const s2 = (timeLeft % 60).toString().padStart(2, '0');
    alienTD.textContent = '⏱️ 에일리언 활동 남은 시간: ' + m2 + ':' + s2;
  }
  // 타이머 버튼 비활성화
  const roomDiv = document.querySelector('.room[data-code="' + roomCode + '"]');
  if (roomDiv) {
    const tb = roomDiv.querySelector('.meeting-timer-btn');
    if (tb) { tb.textContent = timeLeft > 0 ? '타이머 작동 중...' : '타이머 작동'; tb.disabled = timeLeft > 0; }
    const etb = roomDiv.querySelector('.escape-timer-btn');
    if (etb) { etb.textContent = timeLeft > 0 ? '타이머 작동 중...' : '3분 30초 타이머 시작'; etb.disabled = timeLeft > 0; }
  }
});

// ── renderAdminView ────────────────────────────────────────────────────
function renderAdminView() {
  const crc = document.getElementById('create-room-container');
  roomsContainer.innerHTML = '';
  if (Object.keys(gameRoomsState).length === 0) {
    if (crc) crc.style.display = 'block';
    roomsContainer.innerHTML = '<p>아직 활성화된 게임방이 없습니다.</p>';
    return;
  }
  if (crc) crc.style.display = 'none';

  for (const code in gameRoomsState) {
    const rd = gameRoomsState[code];
    const roomDiv = document.createElement('div');
    roomDiv.className = 'room container';
    roomDiv.dataset.code = code;

    // 헤더
    const header = document.createElement('div');
    header.className = 'room-header';
    const titleWrap = document.createElement('div');
    titleWrap.style.cssText = 'display:flex;align-items:center;';
    const h2 = document.createElement('h2');
    h2.textContent = '방 코드: ' + code;
    const countSpan = document.createElement('span');
    countSpan.className = 'role-summary';
    countSpan.textContent = '총 인원: ' + rd.players.length + '명';
    countSpan.style.marginLeft = '20px';
    titleWrap.appendChild(h2);
    titleWrap.appendChild(countSpan);
    const timerSpan = document.createElement('span');
    timerSpan.id = 'timer-display-' + code;
    timerSpan.className = 'admin-timer-display';
    header.appendChild(titleWrap);
    header.appendChild(timerSpan);
    roomDiv.appendChild(header);

    const contentDiv = document.createElement('div');
    contentDiv.style.cssText = 'display:flex;gap:20px;';

    if (rd.status === 'waiting') {
      renderWaitingLayout(contentDiv, code, rd);
    } else {
      renderPlayingLayout(contentDiv, code, rd);
    }

    roomDiv.appendChild(contentDiv);
    roomsContainer.appendChild(roomDiv);
  }
}

// ── 대기실 레이아웃 ────────────────────────────────────────────────────
function renderWaitingLayout(contentDiv, code, rd) {
  // 1열: 참가자
  const col1 = document.createElement('div');
  col1.style.flex = '5';
  col1.innerHTML = '<h3>참가자 목록</h3>';
  const ul = document.createElement('ul');
  ul.className = 'waiting-player-grid';
  rd.players.forEach(function(p) {
    const li = document.createElement('li');
    const nameSpan = document.createElement('div');
    nameSpan.textContent = p.name;
    nameSpan.style.fontWeight = 'bold';
    const kickBtn = document.createElement('button');
    kickBtn.textContent = '퇴장';
    kickBtn.className = 'kick-btn';
    kickBtn.dataset.playerId = p.id;
    kickBtn.dataset.playerName = p.name;
    li.appendChild(nameSpan);
    li.appendChild(kickBtn);
    ul.appendChild(li);
  });
  col1.appendChild(ul);

  // 2열: 게임 설정
  const col2 = document.createElement('div');
  col2.style.flex = '3';
  col2.innerHTML = '<h3>게임 설정</h3>';

  // 도움말
  const help = document.createElement('div');
  help.style.cssText = 'padding:10px;margin-top:15px;border:1px solid #28a745;border-radius:5px;background:#f8f9fa;color:#333;';
  help.innerHTML = '<b>[진행 가이드]</b> 역할 인원을 맞추고 <b>\'게임 시작\'</b> 버튼을 누르세요.';
  col2.appendChild(help);

  // 미션 프리셋
  const mpDiv = document.createElement('div');
  mpDiv.style.marginTop = '15px';
  mpDiv.innerHTML = '<h4>미션 프리셋 설정</h4>';
  if (missionPresetsState.length > 0) {
    const sel = document.createElement('select');
    sel.className = 'preset-select';
    sel.id = 'mission-preset-select-' + code;
    missionPresetsState.forEach(function(name) {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    sel.selectedIndex = Math.floor(Math.random() * missionPresetsState.length);

// ── TAB 1: 참가자 현황 ────────────────────────────────────────────────
function renderTabPlayers(panel, code, rd) {
  const living = rd.players.filter(function(p) { return p.status === 'alive'; }).length;
  const hdr = document.createElement('div');
  hdr.className = 'col-header';
  hdr.textContent = '👥 참가자 현황 (' + living + '/' + rd.players.length + ')';
  panel.appendChild(hdr);

  const sorted = [...rd.players].sort(function(a, b) {
    function score(r) {
      if (ALIENS.includes(r)) return 3;
      if (CORE_CREW.includes(r)) return 2;
      if (SPECIAL_CREW.includes(r)) return 1;
      return 0;
    }
    return score(b.role) - score(a.role);
  });
  const ul = document.createElement('ul');
  ul.className = 'player-grid-list';
  sorted.forEach(function(player) {
    const li = document.createElement('li');
    const info = document.createElement('div');
    info.className = 'player-info-container';
    let roleClass = 'player-info-role';
    if (ALIENS.includes(player.role)) roleClass += ' role-alien';
    else if (CORE_CREW.includes(player.role)) roleClass += ' role-core-crew';
    else if (SPECIAL_CREW.includes(player.role)) roleClass += ' role-special-crew';
    let roleText = player.role || '역할 미정';
    if (player.role === '경호원' && rd.bodyguardProtection === player.id) {
      const pp = rd.players.find(function(p) { return p.id === rd.bodyguardProtection; });
      if (pp) roleText += ' ▶ ' + pp.name + ' 보호 중';
    }
    if ((player.role === '함장' || player.role === '군인') && typeof player.bullets !== 'undefined') {
      roleText += ' (총알: ' + player.bullets + ')';
    }
    const groupText = player.group ? player.group + '모둠' : '모둠 미정';
    info.innerHTML = '<div class="player-info-name">' + player.name + '</div>' +
      '<div class="player-info-group">' + groupText + '</div>' +
      '<div class="' + roleClass + '">' + roleText + '</div>';
    li.appendChild(info);

    // ★ Q4: 💚 아이콘만 (퇴장 버튼 제거, 사망 시 💀 표시만)
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;min-width:44px;';
    if (player.status === 'dead') {
      li.classList.add('dead');
      const deadIco = document.createElement('span');
      deadIco.textContent = '💀';
      deadIco.style.cssText = 'font-size:1.4em;opacity:.6;';
      btnWrap.appendChild(deadIco);
    } else {
      const elimBtn = document.createElement('button');
      elimBtn.textContent = '💚';
      elimBtn.title = '클릭 → 사망 처리';
      elimBtn.className = 'status-icon-btn alive eliminate-btn';
      elimBtn.dataset.playerId = player.id;
      btnWrap.appendChild(elimBtn);
    }
    li.appendChild(btnWrap);
    ul.appendChild(li);
  });
  panel.appendChild(ul);

  // 게임 로그
  const logBox = document.createElement('div');
  logBox.className = 'admin-log-box';
  logBox.innerHTML = (rd.gameLog || []).map(function(e) {
    const text = typeof e === 'string' ? e : e.text;
    const type = typeof e === 'string' ? 'log' : (e.type || 'log');
    return '<p class="log-' + type + '">' + text + '</p>';
  }).join('');
  panel.appendChild(logBox);
}

// ── TAB 2: 게임 진행 ──────────────────────────────────────────────────
function phaseBadge(rd) {
  const el = document.createElement('div');
  let cls = 'phase-badge', text = '';
  if (rd.status === 'game_over') {
    cls += ' special'; text = '🏁 게임 종료 — ' + rd.winner + ' 승리';
  } else if (rd.phase === 'role_reveal') {
    cls += ' day'; text = '☀️ ' + rd.day + '일차 — 역할 확인';
  } else if (rd.phase === 'meeting') {
    cls += ' day';
    const sub = { pending_start:'자기소개 단계', nominating:'후보 지목 중', minigame_pending:'미니게임 준비',
                  minigame_active:'미니게임 진행 중', minigame_all_selected:'결과 공개 대기' };
    text = '☀️ ' + rd.day + '일차 회의 — ' + (sub[rd.ejectionState] || rd.ejectionState || '');
  } else if (rd.phase === 'night_alien_action') {
    cls += ' night-alien'; text = '🌙 ' + rd.day + '일차 밤 — 🔴 에일리언 활동';
    if (rd.pendingAction === 'queen_rampage') text += ' / 👑 여왕의 만찬';
  } else if (rd.phase === 'night_crew_action') {
    cls += ' night-crew'; text = '🌙 ' + rd.day + '일차 밤 — 🟡 탐사대 활동 중';
  } else if (rd.phase === 'escape_sequence') {
    cls += ' special'; text = '🚀 비상탈출 시퀀스 — 관문 ' + ((rd.escapeStep || 0) + 1);
  } else {
    cls += ' day'; text = rd.day + '일차 ' + rd.phase;
  }
  el.className = cls;
  el.textContent = text;
  return el;
}

    if (rd.alienActionTriggered) {
      const atd = document.createElement('div');
      atd.style.cssText = 'margin-top:8px;padding:8px;background:#2c1f3e;border-radius:6px;color:#c084fc;font-size:.95em;font-weight:bold;text-align:center;';
      atd.id = 'alien-timer-display-' + code;
      atd.textContent = '⏱️ 에일리언 활동 중... (자동 종료 대기)';
      panel.appendChild(atd);
      const rnb = document.createElement('button');
      rnb.className = 'resolve-night-btn';
      rnb.style.cssText = 'background:#6c757d;margin-top:6px;font-size:.85em;';
      rnb.textContent = '⚙️ 수동: 결과반영 및 탐사대 활동 시작';
      panel.appendChild(rnb);
    } else {
      const tab = document.createElement('button');
      tab.className = 'trigger-alien-action-btn';
      tab.textContent = '(모두 엎드린 후 클릭) 에일리언 활동 시작';
      panel.appendChild(tab);
    }
    if (rd.pendingAction === 'queen_rampage') {
      const qb = document.createElement('button');
      qb.className = 'trigger-rampage-btn';
      qb.textContent = '여왕의 만찬 시작';
      qb.style.cssText = 'background:#dc3545;margin-top:8px;';
      panel.appendChild(qb);
      const qr = document.createElement('button');
      qr.id = 'resolve-rampage-btn';
      qr.textContent = '만찬 종료 → 탐사대 활동';
      panel.appendChild(qr);
    }
  }
  // 밤: 탐사대 활동 – Q1 버튼 텍스트 변경
  else if (rd.phase === 'night_crew_action') {
    const eb = document.createElement('button');
    eb.className = 'end-night-btn';
    eb.textContent = (rd.day + 1) + '일차 아침으로 진행';
    panel.appendChild(eb);
  }

  // Q4: 진행 가이드 맨 아래
  const help = document.createElement('div');
  help.className = 'help-box';
  help.style.marginTop = '12px';
  let ht = '';
  if (rd.pendingAction === 'crisis_roulette') ht = '⚠️ 위기 룰렛! <b>룰렛 시작</b> 버튼 클릭.';
  else {
    switch (rd.phase) {
      case 'role_reveal': ht = '역할 확인 후 <b>1일차 회의 시작</b> 클릭.'; break;
      case 'meeting':
        if (rd.ejectionState === 'pending_start') ht = rd.autoMode ? '⚡ 타이머 자동 시작됨. 30초 전 지목 화면 자동 표시.' : '자기소개 → 타이머 → 후보 지목 시작.';
        else if (rd.ejectionState === 'nominating') ht = '모둠별 투표를 <b>모니터링 열</b>에서 확인.';
        else if (rd.ejectionState === 'minigame_pending') ht = '후보 지목 완료 → <b>방출 미니게임 시작</b>.';
        else ht = '모니터링 열 확인 → 전원 선택 시 <b>결과 공개</b>.';
        break;
      case 'night_alien_action': ht = rd.alienActionTriggered ? '에일리언 선택 대기 중. 완료 시 자동 탐사대 활동으로 이동.' : '모두 엎드린 후 <b>에일리언 활동 시작</b> 클릭.'; break;
      case 'night_crew_action': ht = '탐사대 활동 확인 후 <b>' + rd.day + '일차 아침으로 진행</b> 클릭.'; break;
      case 'escape_sequence': ht = '각 관문 확인 후 <b>관문 확인</b> 클릭.'; break;
      default: ht = '다음 단계 버튼을 클릭하세요.';
    }
  }
  help.innerHTML = '💡 ' + ht;
  panel.appendChild(help);
}
// ── TAB 3: 모니터링 ───────────────────────────────────────────────────
function renderTabMonitor(panel, code, rd) {
  const hdr = document.createElement('div');
  hdr.className = 'col-header';
  hdr.textContent = '📊 모니터링';
  panel.appendChild(hdr);

  let hasContent = false;

  // ── 탈출: 역할 주장 현황 ──────────────────────────────────
  if (rd.pendingAction === 'escape_role_claim') {
    hasContent = true;
    const rc = rd.claimedRoles || {};
    const living = rd.players.filter(function(p) { return p.status === 'alive'; });
    const claimed = living.filter(function(p) { return rc[p.id]; }).length;
    const rtTitle = document.createElement('h4');
    rtTitle.textContent = '🚀 역할 주장 현황 (' + claimed + '/' + living.length + ')';
    panel.appendChild(rtTitle);
    living.forEach(function(p) {
      const row = document.createElement('div');
      const hasClaimed = !!rc[p.id];
      row.className = 'claim-row' + (hasClaimed ? ' claimed' : '');
      const nameSpan = document.createElement('span');
      nameSpan.textContent = p.name;
      row.appendChild(nameSpan);
      if (hasClaimed) {
        const badge = document.createElement('span');
        badge.className = 'claim-role-badge';
        badge.textContent = rc[p.id];
        row.appendChild(badge);
      } else {
        const wait = document.createElement('span');
        wait.style.cssText = 'color:#aaa;font-size:.85em;';
        wait.textContent = '주장 중...';
        row.appendChild(wait);
      }
      panel.appendChild(row);
    });
  }

  // ── 탈출: 투표 현황 ──────────────────────────────────────
  if (rd.pendingAction === 'escape_survivor_selection') {
    hasContent = true;
    const ev = rd.escapeVotes || {};
    const living = rd.players.filter(function(p) { return p.status === 'alive'; });
    const votedCount = Object.keys(ev).length;
    const evTitle = document.createElement('h4');
    evTitle.textContent = '🗳️ 탈출 캡슐 투표 (' + votedCount + '/' + living.length + ')';
    panel.appendChild(evTitle);
    living.forEach(function(p) {
      const row = document.createElement('div');
      const votedFor = ev[p.id];
      const hasVoted = !!votedFor;
      row.className = 'claim-row' + (hasVoted ? ' claimed' : '');
      const nameSpan = document.createElement('span');
      nameSpan.textContent = p.name;
      row.appendChild(nameSpan);
      if (hasVoted) {
        const tp = rd.players.find(function(q) { return q.id === votedFor; });
        const badge = document.createElement('span');
        badge.className = 'claim-role-badge';
        badge.textContent = '▶ ' + (tp ? tp.name : '???');
        row.appendChild(badge);
      } else {
        const wait = document.createElement('span');
        wait.style.cssText = 'color:#aaa;font-size:.85em;';
        wait.textContent = '투표 중...';
        row.appendChild(wait);
      }
      panel.appendChild(row);
    });
  }

  // ── 탈출: 최종 탑승자 확정 ───────────────────────────────
  if (rd.pendingAction === 'escape_ready' && rd.escapees && rd.escapees.length > 0) {
    hasContent = true;
    const erTitle = document.createElement('h4');
    erTitle.textContent = '🛸 최종 탑승자 명단';
    panel.appendChild(erTitle);
    rd.escapees.forEach(function(p) {
      const row = document.createElement('div');
      row.className = 'claim-row claimed';
      row.innerHTML = '<span>' + p.name + '</span><span class="claim-role-badge">' + p.role + '</span>';
      panel.appendChild(row);
    });
  }

  // 지목 투표 현황
  if (rd.phase === 'meeting' && rd.ejectionState === 'nominating') {
    hasContent = true;
    const alive = rd.players.filter(function(p) { return p.status === 'alive' && p.group; });
    const gCounts = {};
    alive.forEach(function(p) { gCounts[p.group] = (gCounts[p.group] || 0) + 1; });
    const voters = alive.filter(function(p) { return gCounts[p.group] > 1; });
    let voted = 0;
    if (rd.ejectionVotes) {
      Object.values(rd.ejectionVotes).forEach(function(gv) { voted += Object.keys(gv).length; });
    }
    const vTitle = document.createElement('h4');
    vTitle.textContent = '🗳️ 1차 후보 지목 현황 (' + voted + '/' + voters.length + ')';
    panel.appendChild(vTitle);
    const grid = document.createElement('ul');
    grid.className = 'vote-status-grid';
    voters.forEach(function(voter) {
      const tid = rd.ejectionVotes?.[voter.group]?.[voter.id];
      const li = document.createElement('li');
      li.className = 'vote-status-item' + (tid ? ' voted' : '');
      if (tid) {
        const tp = rd.players.find(function(p) { return p.id === tid; });
        li.innerHTML = '<b>' + voter.name + '</b> ▶ ' + (tp ? tp.name : '???');
      } else {
        li.innerHTML = '<b>' + voter.name + '</b>: (투표 중...)';
      }
      grid.appendChild(li);
    });
    panel.appendChild(grid);
  }

  // 방출 미니게임 현황
  if (rd.phase === 'meeting' && ['minigame_active','minigame_all_selected'].includes(rd.ejectionState)) {
    const mg = rd.ejectionMinigame;
    if (mg && mg.candidates) {
      hasContent = true;
      const mgTitle = document.createElement('h4');
      mgTitle.textContent = '🎮 방출 미니게임 현황 (관리자 전용)';
      panel.appendChild(mgTitle);
      mg.candidates.forEach(function(cId) {
        const cp = rd.players.find(function(p) { return p.id === cId; });
        const selId = mg.selections ? mg.selections[cId] : undefined;
        const row = document.createElement('div');
        row.className = 'mg-row';
        const ns = document.createElement('strong');
        ns.textContent = cp ? cp.name : '???';
        row.appendChild(ns);
        const cs = document.createElement('span');
        if (selId !== undefined) {
          const card = mg.cards ? mg.cards.find(function(c) { return c.id === selId; }) : null;
          if (card && card.content === '방출') { cs.className = 'mg-card ejection'; cs.textContent = '💀 방출'; }
          else if (card) { cs.className = 'mg-card survival'; cs.textContent = '💚 생존'; }
          else { cs.className = 'mg-card pending'; cs.textContent = '선택됨'; }
        } else { cs.className = 'mg-card pending'; cs.textContent = '선택 중...'; }
        row.appendChild(cs);
        panel.appendChild(row);
      });
    }
  }

  if (!hasContent) {
    const noData = document.createElement('p');
    noData.style.color = '#aaa';
    noData.textContent = '현재 모니터링할 내용이 없습니다.';
    panel.appendChild(noData);
  }
}

// ── 클릭 핸들러 ───────────────────────────────────────────────────────
roomsContainer.addEventListener('click', function(event) {
  const target = event.target;
  const roomDiv = target.closest('.room');
  if (!roomDiv) return;
  const roomCode = roomDiv.dataset.code;
  const cl = target.classList;

  if (cl.contains('meeting-timer-btn')) {
    socket.emit('startMeetingTimer', roomCode);
  } else if (cl.contains('start-game-btn')) {
    const players = gameRoomsState[roomCode].players;
    if (players.length < 4) { alert('최소 인원(4명)이 모이지 않아 시작할 수 없습니다.'); return; }
    const roleSettings = {};
    let totalRoles = 0;
    roomDiv.querySelectorAll('.role-controls input').forEach(function(inp) {
      const cnt = parseInt(inp.value, 10);
      if (cnt > 0) roleSettings[inp.dataset.role] = cnt;
      totalRoles += cnt || 0;
    });
    if (totalRoles > 0 && totalRoles !== players.length) {
      alert('설정된 역할의 합계가 총 플레이어 수와 일치하지 않습니다.');
      return;
    }
    const gc = document.getElementById('group-count-' + roomCode);
    const ps = document.getElementById('mission-preset-select-' + roomCode);
    const ej = document.getElementById('ejection-minigame-toggle-' + roomCode);
    socket.emit('startGame', {
      code: roomCode,
      settings: roleSettings,
      groupCount: parseInt(gc.value, 10) || 4,
      selectedPreset: ps ? ps.value : '',
      useEjectionMinigame: ej ? ej.checked : true
    });
  } else if (cl.contains('auto-assign-btn')) {
    // ★ 자동 역할 배정
    const rc = target.dataset.roomCode;
    const aaInp = document.getElementById('auto-assign-inp-' + rc);
    const total = parseInt(aaInp.value, 10);
    if (isNaN(total) || total < 4) { alert('최소 4명 이상 입력하세요.'); return; }
    const assigned = autoAssignRoles(total);
    if (!assigned) { alert('배정 실패'); return; }
    const roleInputs = roomDiv.querySelectorAll('.role-controls input');
    let newTotal = 0;
    roleInputs.forEach(function(inp) {
      const v = assigned[inp.dataset.role] || 0;
      inp.value = v;
      newTotal += v;
    });
    const ts = document.getElementById('total-roles-' + rc);
    if (ts) ts.textContent = '총원: ' + newTotal;
  } else if (cl.contains('apply-auto-btn')) {
    const rc = target.dataset.roomCode;
    const chk = document.getElementById('auto-chk-' + rc);
    const mt = document.getElementById('auto-mt-' + rc);
    const at = document.getElementById('auto-at-' + rc);
    socket.emit('setAutoMode', {
      roomCode: rc,
      autoMode: chk ? chk.checked : false,
      meetingTime: mt ? parseInt(mt.value) : 90,
      alienTime: at ? parseInt(at.value) : 60
    });
    alert('자동 진행 모드 설정이 저장되었습니다.');
  } else if (cl.contains('start-nomination-btn')) {
    const rd2 = gameRoomsState[roomCode];
    const unsel = rd2.players.filter(function(p) { return p.status === 'alive' && !p.group; });
    if (unsel.length > 0) {
      alert('아직 모둠을 선택하지 않은 참가자가 있습니다: ' + unsel.map(function(p) { return p.name; }).join(', '));
    } else {
      if (confirm('모든 참가자에게 후보 지목 화면을 띄웁니다. 진행할까요?')) {
        socket.emit('startEjectionNomination', { code: roomCode });
      }
    }
  } else if (cl.contains('start-ejection-minigame-btn')) {
    // 미투표자 팝업 제거: 자동진행에서 미투표자는 이미 페널티 후보로 등록됨
    if (confirm('방출 미니게임을 시작합니다. 진행할까요?')) {
      socket.emit('startEjectionMinigame', { code: roomCode });
    }
  } else if (cl.contains('resolve-ejection-minigame-btn')) {
    if (confirm('결과를 공개하고 방출자를 확정하시겠습니까?')) {
      socket.emit('resolveEjectionMinigame', { code: roomCode });
    }
  } else if (cl.contains('trigger-rampage-btn')) {
    socket.emit('triggerQueenRampage', { code: roomCode });
  } else if (target.id === 'resolve-rampage-btn') {
    socket.emit('resolveQueenRampage', { code: roomCode });
  } else if (cl.contains('eliminate-btn')) {
    if (confirm('정말로 이 플레이어를 사망 처리하시겠습니까?')) {
      socket.emit('eliminatePlayer', { roomCode, playerId: target.dataset.playerId, cause: 'admin_action' });
    }
  } else if (cl.contains('next-phase-btn')) {
    socket.emit('nextPhase', { code: roomCode, phase: target.dataset.phase, day: target.dataset.day });
  } else if (cl.contains('trigger-alien-action-btn')) {
    socket.emit('triggerAlienAction', { code: roomCode });
  } else if (cl.contains('resolve-night-btn')) {
    socket.emit('resolveNightActions', { code: roomCode });
  } else if (cl.contains('trigger-crew-action-btn')) {
    socket.emit('triggerCrewAction', { code: roomCode });
  } else if (cl.contains('end-night-btn')) {
    socket.emit('endNightAndStartMeeting', { code: roomCode });
  } else if (cl.contains('start-escape-vote-btn')) {
    if (confirm('모든 생존자에게 투표 화면을 띄웁니다. 진행할까요?')) {
      socket.emit('startEscapeVote', { code: roomCode });
    }
  } else if (cl.contains('start-escape-sequence-btn')) {
    const rd2 = gameRoomsState[roomCode];
    const ids = (rd2.escapees || []).map(function(p) { return p.id; });
    if (ids.length !== 4) { alert('오류: 최종 탑승자가 4명이 아닙니다.'); return; }
    socket.emit('startEscapeSequence', { code: roomCode, survivorIds: ids });
  } else if (cl.contains('escape-timer-btn')) {
    socket.emit('startEscapeTimer', roomCode);
    target.textContent = '타이머 작동 중...';
    target.disabled = true;
  } else if (cl.contains('force-escape-fail-btn')) {
    if (confirm('정말로 시간 초과로 비상탈출을 실패 처리하시겠습니까?')) {
      socket.emit('forceEscapeFailure', { code: roomCode });
    }
  } else if (cl.contains('resolve-escape-step-btn')) {
    socket.emit('resolveEscapeStep', { code: roomCode });
  } else if (cl.contains('start-crisis-roulette-btn')) {
    const crisis = gameRoomsState[roomCode]?.crisis;
    const ct = crisis ? '[' + crisis.type + ']' : '';
    if (confirm(ct + ' 룰렛을 시작하면 모든 참가자에게 결과가 공개됩니다. 정말 진행하시겠습니까?')) {
      socket.emit('startCrisisRoulette', { roomCode });
    }
  } else if (cl.contains('kick-btn')) {
    const pName = target.dataset.playerName;
    if (confirm('\'' + pName + '\' 님을 대기실에서 퇴장시키겠습니까?')) {
      socket.emit('kickPlayer', { roomCode, playerId: target.dataset.playerId });
    }
  }
});
</script>
