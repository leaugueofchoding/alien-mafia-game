<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에일리언 마피아 — 관리자</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ═══════════════════════════════════════════════
   디자인 토큰
═══════════════════════════════════════════════ */
    :root {
      --bg: #0f111a;
      --surface: #1a1d2e;
      --surface2: #232640;
      --border: #2e3250;
      --accent: #5b8dee;
      --accent2: #7c5cbf;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --cyan: #06b6d4;
      --purple: #a855f7;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --alien-red: #dc2626;
      --crew-blue: #3b82f6;
      --night-bg: #0d0720;
      --night-border: #4c1d95;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: block;
    }

    #game-rooms-container {
      padding: 0 16px 16px;
    }

    /* ─── 최상단 헤더 ─────────────────────────────── */
    /* header inline으로 처리 */

    /* ─── 방 생성 / 초기화 ────────────────────────── */
    .create-room-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .create-room-bar input {
      flex: 1;
      max-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: .9rem;
    }

    .create-room-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ─── 공통 버튼 ───────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-success {
      background: var(--green);
      color: #fff;
    }

    .btn-danger {
      background: var(--red);
      color: #fff;
    }

    .btn-warning {
      background: var(--yellow);
      color: #000;
    }

    .btn-purple {
      background: var(--accent2);
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    .btn-sm {
      padding: 5px 11px;
      font-size: .8rem;
    }

    .btn-full {
      width: 100%;
    }

    .btn-night {
      background: #2d1b69;
      color: #c084fc;
      border: 1px solid #4c1d95;
    }

    .btn-night:hover {
      background: #3b2380;
    }

    .btn-night-red {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
    }

    /* ─── 방 카드 ─────────────────────────────────── */
    .room-card {
      margin: 0 0 12px 0;
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* 방 헤더 */
    .room-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .room-code-label {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: .05em;
    }

    .room-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .player-count-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: .85rem;
      color: var(--text2);
    }

    /* 타이머 디스플레이 */
    .timer-display {
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 72px;
      text-align: center;
      color: var(--red);
      background: rgba(239, 68, 68, .1);
      border: 2px solid rgba(239, 68, 68, .3);
      border-radius: 8px;
      padding: 4px 12px;
      line-height: 1;
    }

    /* ─── 자동진행 뱃지 (우측 상단) ──────────────── */
    .auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
    }

    .auto-badge.on {
      background: rgba(34, 197, 94, .15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, .3);
    }

    .auto-badge.off {
      background: rgba(100, 116, 139, .12);
      color: var(--text3);
      border: 1px solid var(--border);
    }

    /* ─── 페이즈 뱃지 ─────────────────────────────── */
    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .phase-badge.day {
      background: rgba(245, 158, 11, .12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, .3);
    }

    .phase-badge.night-alien {
      background: rgba(220, 38, 38, .12);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, .3);
    }

    .phase-badge.night-crew {
      background: rgba(167, 139, 250, .12);
      color: #c084fc;
      border: 1px solid rgba(167, 139, 250, .3);
    }

    .phase-badge.special {
      background: rgba(6, 182, 212, .12);
      color: #67e8f9;
      border: 1px solid rgba(6, 182, 212, .3);
    }

    /* ─── 3열 레이아웃 ────────────────────────────── */
    .room-body {
      display: flex;
      gap: 0;
      min-height: 300px;
    }

    .col {
      padding: 12px 14px;
      overflow: hidden;
    }

    .col+.col {
      border-left: 1px solid var(--border);
    }

    .col-players {
      flex: 5;
      min-width: 0;
    }

    .col-game {
      flex: 4;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .col-monitor {
      flex: 4;
      min-width: 0;
    }

    .col-header {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text3);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ─── 참가자 그리드 ───────────────────────────── */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 6px;
      list-style: none;
      margin: 0 0 12px 0;
      padding: 0;
    }

    .player-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
      position: relative;
    }

    .player-card.dead {
      opacity: .45;
      filter: grayscale(.6);
    }

    .player-card.alien-team {
      border-color: rgba(239, 68, 68, .4);
    }

    .player-card.core-crew {
      border-color: rgba(59, 130, 246, .4);
    }

    .player-card.special-crew {
      border-color: rgba(34, 197, 94, .25);
    }

    .player-name {
      font-size: .82rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }

    .player-group {
      font-size: .7rem;
      color: var(--text3);
    }

    .player-role {
      font-size: .72rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .role-alien {
      background: rgba(239, 68, 68, .2);
      color: #fca5a5;
    }

    .role-crew-core {
      background: rgba(59, 130, 246, .2);
      color: #93c5fd;
    }

    .role-crew-spec {
      background: rgba(34, 197, 94, .2);
      color: #86efac;
    }

    .role-default {
      background: var(--surface);
      color: var(--text3);
    }

    .elim-btn {
      margin-top: 2px;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      opacity: .7;
    }

    .elim-btn:hover {
      opacity: 1;
    }

    /* ─── 게임 로그 ───────────────────────────────── */
    .game-log {
      flex: 1;
      overflow-y: auto;
      max-height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: .78rem;
      line-height: 1.6;
    }

    .game-log p {
      margin: 0;
      color: var(--text2);
    }

    .game-log .log-phase_change {
      color: var(--yellow);
      font-weight: 700;
    }

    .game-log .log-mission_buff {
      color: var(--cyan);
    }

    /* ─── 게임 진행 버튼들 ────────────────────────── */
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    /* ─── 진행 가이드 ─────────────────────────────── */
    .guide-box {
      margin-top: auto;
      padding-top: 12px;
      padding: 10px 12px;
      background: rgba(91, 141, 238, .07);
      border: 1px solid rgba(91, 141, 238, .2);
      border-radius: 6px;
      font-size: .8rem;
      color: var(--text2);
      line-height: 1.5;
      margin-top: 12px;
    }

    .guide-box b {
      color: var(--accent);
    }

    /* ─── 모니터링 행 ─────────────────────────────── */
    .monitor-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: .83rem;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .monitor-row.voted {
      background: rgba(34, 197, 94, .08);
      border-color: rgba(34, 197, 94, .2);
    }

    .mg-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: .75rem;
      font-weight: 700;
    }

    .mg-badge.ejection {
      background: rgba(239, 68, 68, .25);
      color: #fca5a5;
    }

    .mg-badge.survival {
      background: rgba(34, 197, 94, .25);
      color: #86efac;
    }

    .mg-badge.pending {
      background: var(--surface);
      color: var(--text3);
    }

    /* ─── 탈출 역할 주장 ──────────────────────────── */
    .claim-badge {
      font-size: .75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(91, 141, 238, .2);
      color: #93c5fd;
    }

    /* ─── 대기실 설정 ─────────────────────────────── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .setting-item label {
      display: block;
      font-size: .73rem;
      color: var(--text3);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .setting-item input,
    .setting-item select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: .85rem;
    }

    .setting-item input:focus,
    .setting-item select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .setting-item.full {
      grid-column: 1 / -1;
    }

    /* 자동진행 설정 패널 */
    .auto-settings {
      background: rgba(34, 197, 94, .06);
      border: 1px solid rgba(34, 197, 94, .2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .auto-settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .auto-settings-header label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--green);
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 38px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      transition: .2s;
      cursor: pointer;
    }

    .toggle-slider:before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: .2s;
    }

    .toggle-switch input:checked+.toggle-slider {
      background: var(--green);
    }

    .toggle-switch input:checked+.toggle-slider:before {
      transform: translateX(18px);
    }

    .auto-time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 역할 배정 */
    .role-assign-panel {
      background: rgba(91, 141, 238, .06);
      border: 1px solid rgba(91, 141, 238, .2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .role-assign-panel h5 {
      margin: 0 0 8px;
      font-size: .8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .quick-assign-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .quick-assign-row input {
      width: 70px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text);
      font-size: .85rem;
    }

    .role-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .role-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .8rem;
      padding: 3px 6px;
      border-radius: 4px;
      background: var(--bg);
    }

    .role-row span {
      color: var(--text2);
    }

    .role-row input {
      width: 44px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text);
      font-size: .82rem;
      text-align: center;
    }

    .total-count {
      text-align: right;
      font-size: .78rem;
      color: var(--text3);
      margin-top: 4px;
    }

    /* 대기실 참가자 */
    .waiting-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 5px;
      list-style: none;
      margin: 0 0 10px 0;
      padding: 0;
    }

    .waiting-grid li {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      font-size: .8rem;
    }

    .waiting-grid li .name {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }

    .kick-btn {
      background: rgba(239, 68, 68, .15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, .25);
      border-radius: 4px;
      font-size: .7rem;
      padding: 1px 6px;
      cursor: pointer;
    }

    .kick-btn:hover {
      background: rgba(239, 68, 68, .3);
    }

    /* 서버 초기화 */
    .reset-bar {
      margin: 16px 24px;
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .2);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .reset-bar p {
      margin: 0;
      font-size: .8rem;
      color: var(--text3);
    }

    /* 탈출 로그 */
    .escape-log {
      background: #0a0a0a;
      color: #4ade80;
      font-family: monospace;
      font-size: .8rem;
      border-radius: 6px;
      padding: 8px 10px;
      height: 110px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    /* 투표 현황 그리드 */
    .vote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    /* 스크롤바 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <!-- 최상단 헤더 -->
  <div
    style="background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;">
    <h1 style="margin:0;font-size:1rem;font-weight:700;color:var(--accent);">🛸 에일리언 마피아 — 관리자</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="text" id="new-room-code-input" placeholder="게임방 코드"
        style="width:140px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:.88rem;">
      <button id="create-room-btn" class="btn btn-primary btn-sm">🚀 방 생성</button>
      <div style="width:1px;height:20px;background:var(--border);margin:0 4px;"></div>
      <button id="reset-server-btn" class="btn btn-danger btn-sm">🗑 초기화</button>
    </div>
  </div>

  <!-- 방 목록 -->
  <div id="game-rooms-container"></div>

  <!-- 서버 초기화는 헤더로 이동 -->
  <script>
    const socket = io();
    const roomsContainer = document.getElementById('game-rooms-container');

    document.getElementById('create-room-btn').addEventListener('click', function () {
      const inp = document.getElementById('new-room-code-input');
      const code = inp.value.trim();
      if (code) { socket.emit('createRoom', { code }); inp.value = ''; }
    });
    document.getElementById('reset-server-btn').addEventListener('click', function () {
      if (confirm('정말로 서버의 모든 게임 기록을 삭제하시겠습니까?')) socket.emit('resetServer');
    });

    /* ── 상수 ── */
    const ALL_ROLES = ['에일리언 여왕', '에일리언', '에일리언 알', '에일리언 주술사', '함장', '엔지니어', '의사', '경호원', '초능력자', '수다쟁이', '뚱이', '신의 사도', '군인', '일반 승객'];
    const ALIENS = ['에일리언 여왕', '에일리언', '에일리언 알', '에일리언 주술사'];
    const CORE_CREW = ['함장', '엔지니어'];
    const SPECIAL_CREW = ['의사', '경호원', '초능력자', '수다쟁이', '군인', '신의 사도'];

    let gameRoomsState = {};
    let playerCountMap = {}; // BUG1 FIX: 대기실 총원 별도 저장
    let missionPresetsState = [];

    /* ── 자동 역할 배정 ── */
    function autoAssignRoles(total) {
      if (total < 4) return null;
      const c = {}; ALL_ROLES.forEach(r => c[r] = 0);
      ['에일리언 여왕', '함장', '엔지니어', '일반 승객'].forEach(r => c[r] = 1);
      let rem = total - 4;
      const priority = [
        { role: '에일리언', max: total >= 25 ? 2 : 1 },
        { role: '수다쟁이', max: 1 }, { role: '에일리언 알', max: 1 }, { role: '초능력자', max: 1 },
        { role: '뚱이', max: 1 }, { role: '신의 사도', max: 1 }, { role: '에일리언 주술사', max: 1 },
        { role: '군인', max: 1 }, { role: '의사', max: 4 }, { role: '경호원', max: 1 }
      ];
      priority.forEach(item => {
        if (rem <= 0) return;
        const add = Math.min(item.max, rem);
        c[item.role] = add; rem -= add;
      });
      let docCount = c['의사'];
      let tog = true;
      while (rem > 0) {
        if (!tog && docCount < 4) { c['의사']++; docCount++; }
        else c['일반 승객']++;
        tog = !tog; rem--;
      }
      return c;
    }

    /* ── 소켓 ── */
    socket.on('connect', () => socket.emit('adminConnect'));
    socket.on('updateAdmin', data => {
      const prevRooms = gameRoomsState;
      gameRoomsState = data.rooms;
      missionPresetsState = data.missionPresets || [];

      // BUG1 FIX: 별도 Map에 총원 저장 (updateAdmin 때 gameRoomsState 교체돼도 유지)
      for (const code in gameRoomsState) {
        const rd = gameRoomsState[code];
        if (rd.status === 'waiting') {
          playerCountMap[code] = rd.players.length;
        }
      }
      renderAll();

      // 대기실 상태인 방에 대해 자동 배정 인풋 및 역할 수치 갱신
      for (const code in gameRoomsState) {
        const rd = gameRoomsState[code];
        if (rd.status !== 'waiting') continue;
        const total = rd.players.length;
        const aaInp = document.getElementById('auto-assign-inp-' + code);
        if (aaInp) {
          aaInp.value = total;
          // 자동 배정 로직 실행하여 역할 인원도 갱신
          if (total >= 4) {
            const assigned = autoAssignRoles(total);
            if (assigned) {
              const card = document.querySelector('.room-card[data-code="' + code + '"]');
              if (card) {
                let t = 0;
                card.querySelectorAll('.role-row input').forEach(i => {
                  const v = assigned[i.dataset.role] || 0;
                  i.value = v;
                  t += v;
                });
                const ts = document.getElementById('total-roles-' + code);
                if (ts) ts.textContent = '총원: ' + t;
              }
            }
          }
        }
      }
    });
    socket.on('confirmForceEject', data => {
      const roomDiv = document.querySelector('.room-card');
      if (!roomDiv) return;
      if (confirm('[' + data.playerNames + '] 님이 카드를 선택하지 않았습니다. 방출시키겠습니까?'))
        socket.emit('forceEjectPlayers', { roomCode: roomDiv.dataset.code, playerIds: data.playerIds });
    });
    socket.on('adminError', msg => alert(msg));
    socket.on('crisisRouletteResult', data => {
      const disp = document.querySelector('.room-card[data-code="' + data.roomCode + '"] .crisis-display');
      if (disp) {
        disp.textContent = data.result; disp.style.display = 'block';
        setTimeout(() => { disp.style.display = 'none'; }, 2500);
      }
    });
    socket.on('timerUpdate', data => {
      const { roomCode, timeLeft } = data;
      const td = document.getElementById('timer-' + roomCode);
      if (td) {
        if (timeLeft >= 0) {
          const m = Math.floor(timeLeft / 60), s = String(timeLeft % 60).padStart(2, '0');
          td.textContent = m + ':' + s;
        } else td.textContent = '종료!';
      }
      const atd = document.getElementById('alien-timer-' + roomCode);
      if (atd && timeLeft >= 0) {
        const m = Math.floor(timeLeft / 60), s = String(timeLeft % 60).padStart(2, '0');
        atd.textContent = '⏱ ' + m + ':' + s;
        atd.style.color = timeLeft <= 10 ? '#fca5a5' : '#c084fc';
      }
      const rd = document.querySelector('.room-card[data-code="' + roomCode + '"]');
      if (rd) {
        const tb = rd.querySelector('.meeting-timer-btn');
        if (tb) { tb.textContent = timeLeft > 0 ? '⏱ 타이머 작동 중...' : '⚙ 타이머 강제 시작'; tb.disabled = timeLeft > 0; }
      }
    });

    /* ══════════════════════════════════════════════
       메인 렌더
    ══════════════════════════════════════════════ */
    function preserveInputs() {
      const saved = {};
      document.querySelectorAll('input[id], select[id]').forEach(el => {
        if (el.type === 'checkbox') saved[el.id] = el.checked;
        else saved[el.id] = el.value;
      });
      return saved;
    }
    function restoreInputs(saved) {
      for (const id in saved) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (el.type === 'checkbox') el.checked = saved[id];
        else el.value = saved[id];
      }
    }

    function renderAll() {
      const saved = preserveInputs();
      roomsContainer.innerHTML = '';
      if (!Object.keys(gameRoomsState).length) {
        roomsContainer.innerHTML = '<p style="padding:24px;color:var(--text3);">아직 활성화된 게임방이 없습니다. 방 코드를 입력하고 방 생성 버튼을 누르세요.</p>';
        return;
      }
      for (const code in gameRoomsState) {
        const rd = gameRoomsState[code];
        const card = document.createElement('div');
        card.className = 'room-card';
        card.dataset.code = code;

        /* 헤더 */
        const aliveN = rd.players.filter(p => p.status === 'alive').length;
        const autoBadge = rd.autoMode
          ? '<span class="auto-badge on">⚡ 자동진행 ON</span>'
          : '<span class="auto-badge off">수동 진행</span>';
        card.innerHTML = '<div class="room-card-header">'
          + '<div style="display:flex;align-items:center;gap:14px;">'
          + '<span class="room-code-label">방 코드: ' + code + '</span>'
          + '<span class="player-count-badge">👥 ' + aliveN + ' / ' + rd.players.length + '명</span>'
          + autoBadge
          + '</div>'
          + '<div style="display:flex;align-items:center;gap:10px;">'
          + '<span class="timer-display" id="timer-' + code + '">—</span>'
          + '</div>'
          + '</div>';

        /* 바디 */
        const body = document.createElement('div');
        body.className = 'room-body';
        if (rd.status === 'waiting') {
          renderWaiting(body, code, rd);
        } else {
          renderPlaying(body, code, rd);
        }
        card.appendChild(body);
        roomsContainer.appendChild(card);
      }
      restoreInputs(saved);
    }

       대기실 레이아웃
    ══════════════════════════════════════════════ */

      });

        + '<div><label style="font-size:.73rem;color:var(--text3);display:block;margin-bottom:3px;">에일리언 활동 (초)</label>'
        + '<input type="number" id="auto-at-' + code + '" value="' + (rd.autoAlienTime || 60) + '" min="20" max="180" style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:.85rem;"></div>'
        + '</div>'
        + '<p style="font-size:.72rem;color:var(--text3);margin:6px 0 0;">※ 게임 시작 시 자동 적용. 별도 저장 불필요.</p>';

      /* 기타 설정 */

        psHtml = '<select id="mission-preset-select-' + code + '" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:.83rem;">'
          + missionPresetsState.map(n => '<option>' + esc(n) + '</option>').join('') + '</select>';
      } else { psHtml = '<span style="color:var(--text3);font-size:.8rem;">없음</span>'; }
      settGrid.innerHTML = '<div class="setting-item"><label>미션 프리셋</label>' + psHtml + '</div>'
        + '<div class="setting-item"><label>모둠 수</label><input type="number" id="group-count-' + code + '" value="' + (rd.groupCount || 6) + '" min="2" style="width:70px;"></div>'
        + '<div class="setting-item full"><label style="display:flex;align-items:center;justify-content:space-between;">방출 미니게임 사용'
        + '<label class="toggle-switch" style="width:38px;"><input type="checkbox" class="ejection-minigame-toggle" id="ejection-minigame-toggle-' + code + '" checked><span class="toggle-slider"></span></label>'
        + '</label></div>';
      colG.appendChild(settGrid);

      const startBtn = mk('button', 'btn btn-success btn-full start-game-btn');
      startBtn.textContent = '🚀 게임 시작';
      startBtn.style.marginTop = '8px';
      colG.appendChild(startBtn);

      /* ── 역할 배정 열 ── */
      const colR = mk('div', 'col col-monitor');
      colR.innerHTML = '<div class="col-header">역할 인원 설정</div>';

      /* 자동 배정 */
      const aaPanel = mk('div', 'role-assign-panel');
      const aaTotalSpan = mk('span', ''); aaTotalSpan.id = 'total-roles-' + code;
      aaTotalSpan.style.display = 'none'; // Q1: 중복 제거 - 자동배정 버튼 옆 숫자 입력칸으로 충분
      const currentCounts = (rd.settings && Object.keys(rd.settings).length > 1) ? rd.settings : {};
      aaPanel.innerHTML = '<h5>🎲 총원 → 자동 배정</h5>';
      const aaRow = mk('div', 'quick-assign-row');
      const aaInp = mk('input', ''); aaInp.type = 'number'; aaInp.id = 'auto-assign-inp-' + code;
      aaInp.value = playerCountMap[code] !== undefined ? playerCountMap[code] : rd.players.length; aaInp.min = 0; aaInp.max = 40; aaInp.placeholder = '총원';
      const aaBtn = mk('button', 'btn btn-primary btn-sm auto-assign-btn'); aaBtn.textContent = '자동 배정'; aaBtn.dataset.roomCode = code;
      aaRow.appendChild(aaInp); aaRow.appendChild(aaBtn);
      aaPanel.appendChild(aaRow);
      const totalRow = mk('div', 'total-count'); totalRow.style.display = 'none'; totalRow.appendChild(aaTotalSpan);
      aaPanel.appendChild(totalRow);
      colR.appendChild(aaPanel);

      const roleList = mk('div', 'role-list');
      ALL_ROLES.forEach(rn => {
        const row = mk('div', 'role-row');
        const lbl = mk('span', ''); lbl.textContent = rn;
        const inp = mk('input', ''); inp.type = 'number'; inp.min = 0; inp.dataset.role = rn;
        inp.value = currentCounts[rn] || 0;
        inp.addEventListener('input', () => {
          let t = 0;
          colR.querySelectorAll('.role-row input').forEach(i => t += parseInt(i.value) || 0);
          // ★ 수정2: 총원 표시 항상 보이게 + 인원 불일치 경고
          const totalDisplay = document.getElementById('role-total-display-' + code);
          const connected = rd.players.length;
          if (totalDisplay) {
            totalDisplay.textContent = '역할 합계: ' + t + '명 / 접속: ' + connected + '명';
            totalDisplay.style.color = (t === connected) ? '#86efac' : '#fca5a5';
          }
          // 게임시작 버튼에도 경고 반영
          const startBtn2 = colG.querySelector('.start-game-btn');
          if (startBtn2) {
            if (t > 0 && t !== connected) {
              startBtn2.style.opacity = '0.5';
              startBtn2.title = '역할 합계(' + t + ')와 접속 인원(' + connected + ')이 다릅니다.';

              startBtn2.style.opacity = '1';

      body.appendChild(colP);
      body.appendChild(colG);
      body.appendChild(colR);

    /* ══════════════════════════════════════════════
       게임 진행 레이아웃
    ══════════════════════════════════════════════ */
    function renderPlaying(body, code, rd) {
      const colP = mk('div', 'col col-players');
      const colG = mk('div', 'col col-game');
      const colM = mk('div', 'col col-monitor');

      renderColPlayers(colP, code, rd);
      renderColGame(colG, code, rd);
      renderColMonitor(colM, code, rd);

      body.appendChild(colP);
      body.appendChild(colG);
      body.appendChild(colM);
    }

    /* ── 참가자 현황 열 ── */
    function renderColPlayers(panel, code, rd) {
      panel.innerHTML = '<div class="col-header">👥 참가자 현황</div>';

      const sorted = [...rd.players].sort((a, b) => {
        const sc = r => ALIENS.includes(r) ? 3 : CORE_CREW.includes(r) ? 2 : SPECIAL_CREW.includes(r) ? 1 : 0;
        return sc(b.role) - sc(a.role);
      });
      const grid = mk('ul', 'player-grid');
      sorted.forEach(p => {
        const li = mk('li', 'player-card');
        if (p.status === 'dead') li.classList.add('dead');
        if (ALIENS.includes(p.role)) li.classList.add('alien-team');
        else if (CORE_CREW.includes(p.role)) li.classList.add('core-crew');
        else if (SPECIAL_CREW.includes(p.role)) li.classList.add('special-crew');

        let roleText = p.role || '미정';
        if (p.role === '경호원' && rd.bodyguardProtection === p.id) {
          const pp = rd.players.find(q => q.id === rd.bodyguardProtection);
          if (pp) roleText += '▶' + pp.name;
        }
        if ((p.role === '함장' || p.role === '군인') && typeof p.bullets !== 'undefined')
          roleText += ' (' + p.bullets + '발)';

        const roleCls = ALIENS.includes(p.role) ? 'role-alien'
          : CORE_CREW.includes(p.role) ? 'role-crew-core'
            : SPECIAL_CREW.includes(p.role) ? 'role-crew-spec' : 'role-default';

        const grp = p.group ? p.group + '모둠' : '미정';
        li.innerHTML = '<div class="player-name">' + esc(p.name) + '</div>'
          + '<div class="player-group">' + grp + '</div>'
          + '<div class="player-role ' + roleCls + '">' + esc(roleText) + '</div>';

        const btn = mk('button', 'elim-btn');
        if (p.status === 'dead') { btn.textContent = '💀'; btn.style.cursor = 'default'; }
        else { btn.textContent = '💚'; btn.title = '사망 처리'; btn.className = 'elim-btn eliminate-btn'; btn.dataset.playerId = p.id; }
        li.appendChild(btn);
        grid.appendChild(li);
      });
      panel.appendChild(grid);
    }

    /* ── 게임 진행 열 ── */
    function renderColGame(panel, code, rd) {
      panel.innerHTML = '<div class="col-header">🎮 게임 진행</div>';

      /* 페이즈 뱃지 */
      panel.appendChild(mkPhaseBadge(rd));

      const actions = mk('div', 'action-stack');

      if (rd.status === 'game_over') {
        const p = mk('p', ''); p.style.color = 'var(--text3)'; p.textContent = '게임이 종료되었습니다.';
        panel.appendChild(p);
        return;
      }

      /* 위기 룰렛 */
      if (rd.pendingAction === 'crisis_roulette') {
        const crisis = rd.crisis || {};
        const cb = mk('button', 'btn btn-purple btn-full'); cb.className += ' start-crisis-roulette-btn';
        cb.textContent = '🎲 [' + (crisis.type || '위기') + '] 룰렛 시작';
        actions.appendChild(cb);
        const rp = mk('p', ''); rp.innerHTML = '예상 결과: <b style="color:var(--red)">' + esc(crisis.result || '?') + '</b>';
        rp.style.fontSize = '.85rem'; rp.style.margin = '6px 0 0';
        actions.appendChild(rp);
      }
      /* 비상탈출 시퀀스 */
      else if (rd.phase === 'escape_sequence') {
        const el = mk('div', 'escape-log'); el.innerHTML = (rd.escapeLog || []).join('<br>');
        actions.appendChild(el);
        const rb = mk('button', 'btn btn-warning btn-full resolve-escape-step-btn');

        actions.appendChild(rb);
      }
      /* 엔지니어 대기 */
      else if (rd.pendingAction === 'engineer_choice') {
        const ep = mk('p', ''); ep.textContent = '엔지니어가 선택하기를 기다리는 중...';
        ep.style.cssText = 'font-size:.85rem;color:var(--accent);margin:8px 0;'; actions.appendChild(ep);
      }
      /* 탈출 최종 투표 시작 */
      else if (rd.pendingAction === 'escape_vote_pending') {
        const sv = mk('button', 'btn btn-success btn-full start-escape-vote-btn'); sv.textContent = '최종 투표 시작';
        actions.appendChild(sv);
      }
      /* 탈출 투표 진행 중 */
      else if (rd.pendingAction === 'escape_survivor_selection') {
        const lpc = rd.players.filter(p => p.status === 'alive').length;
        const vpc = Object.keys(rd.escapeVotes || {}).length;
        const vt = mk('p', ''); vt.textContent = '탈출 캡슐 투표 (' + vpc + '/' + lpc + ')';
        vt.style.cssText = 'font-weight:700;margin:0 0 8px;'; actions.appendChild(vt);
        const etBtn = mk('button', 'btn btn-warning btn-full escape-timer-btn');
        const tl = rd.timeLeft || 0;
        etBtn.textContent = tl > 0 ? '⏱ 타이머 작동 중...' : '⏱ 3분 30초 타이머 시작'; if (tl > 0) etBtn.disabled = true;
        actions.appendChild(etBtn);
        const ffBtn = mk('button', 'btn btn-danger btn-full force-escape-fail-btn'); ffBtn.textContent = '시간 초과로 종료';
        actions.appendChild(ffBtn);
      }
      /* 탈출 준비 완료 */
      else if (rd.pendingAction === 'escape_ready') {
        const names = (rd.escapees || []).map(p => esc(p.name) + '(' + esc(p.role) + ')').join(', ');
        const np = mk('p', ''); np.innerHTML = '<b>최종 탑승자:</b> ' + names;
        np.style.cssText = 'font-size:.83rem;margin:0 0 8px;'; actions.appendChild(np);
        const seBtn = mk('button', 'btn btn-success btn-full start-escape-sequence-btn'); seBtn.textContent = '비상탈출 시퀀스 시작';
        actions.appendChild(seBtn);
      }
      /* 역할 공개 */
      else if (rd.phase === 'role_reveal') {
        const b = mk('button', 'btn btn-primary btn-full next-phase-btn');
        b.textContent = '☀️ 1일차 회의 시작'; b.dataset.phase = 'meeting'; b.dataset.day = 1;
        actions.appendChild(b);
      }
      /* 낮: 회의 */
      else if (rd.phase === 'meeting') {
        /* 타이머 버튼 (항상 표시 — 자동이면 비상용) */
        const tBtn = mk('button', 'btn btn-full meeting-timer-btn');
        const tl = rd.timeLeft || 0;
        if (tl > 0) {
          tBtn.textContent = '⏱ 타이머 작동 중...'; tBtn.disabled = true;
          tBtn.className = 'btn btn-ghost btn-full meeting-timer-btn';

          tBtn.textContent = '⚙ 타이머 강제 시작 (비상용)';
          tBtn.className = 'btn btn-ghost btn-full meeting-timer-btn';
        } else {
          tBtn.textContent = '⏱ 타이머 작동'; tBtn.className = 'btn btn-warning btn-full meeting-timer-btn';
        }
        actions.appendChild(tBtn);

        if (rd.settings.useEjectionMinigame) {
          if (rd.ejectionState === 'pending_start') {
            if (!rd.autoMode) {
              const snBtn = mk('button', 'btn btn-warning btn-full start-nomination-btn');
              snBtn.textContent = '🗳 1차 후보 지목 시작'; actions.appendChild(snBtn);
            } else {
              const an = mk('p', ''); an.textContent = '⚡ 자동진행: 30초 전 지목 자동 시작'; an.style.cssText = 'font-size:.78rem;color:var(--green);margin:4px 0;'; actions.appendChild(an);
            }
          } else if (rd.ejectionState === 'nominating') {
            const ip = mk('p', ''); ip.textContent = '🗳 지목 투표 진행 중... (모니터링 열 확인)'; ip.style.cssText = 'font-size:.82rem;color:var(--yellow);font-weight:700;margin:4px 0;'; actions.appendChild(ip);
            const emergNom = mk('button', 'btn btn-ghost btn-full btn-sm'); emergNom.textContent = '⚙ 비상: 방출 미니게임 강제 시작';
            emergNom.style.cssText = 'margin-top:4px;font-size:.78rem;'; emergNom.className = 'btn btn-ghost btn-full start-ejection-minigame-btn'; actions.appendChild(emergNom);
          } else if (rd.ejectionState === 'minigame_pending') {
            // Q3: 자동 시작됨 - 안내만 표시
            const autoMg = mk('p', ''); autoMg.textContent = '⚡ 방출 미니게임 자동 시작 중...';
            autoMg.style.cssText = 'color:var(--purple);font-weight:700;font-size:.88rem;margin:6px 0;'; actions.appendChild(autoMg);
          } else if (['minigame_active', 'minigame_all_selected'].includes(rd.ejectionState)) {
            const resBtn = mk('button', 'btn btn-danger btn-full resolve-ejection-minigame-btn');
            const done = rd.ejectionState === 'minigame_all_selected';
            resBtn.textContent = done ? '💀 결과 공개 및 방출 실행' : '⏳ 후보들 선택 중...'; resBtn.disabled = !done;
            actions.appendChild(resBtn);
          }
        } else {
          const nb = mk('button', 'btn btn-night btn-full next-phase-btn'); nb.textContent = '🌙 밤으로 이동 (탐사대 활동 먼저)'; nb.dataset.phase = 'night_crew_action'; nb.dataset.day = rd.day; actions.appendChild(nb);
        }
      }
      /* 밤: 에일리언 활동 */
      else if (rd.phase === 'night_alien_action') {
        if (rd.autoMode && rd.alienActionTriggered) {
          const atd = mk('div', ''); atd.id = 'alien-timer-' + code;
          atd.style.cssText = 'font-size:1.1rem;font-weight:800;color:#c084fc;text-align:center;padding:8px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:6px;margin-bottom:6px;';
          atd.textContent = '⏱ 에일리언 활동 중...';
          actions.appendChild(atd);
        }
        if (rd.pendingAction === 'queen_rampage') {
          const qBtn = mk('button', 'btn btn-night-red btn-full trigger-rampage-btn'); qBtn.textContent = '👑 여왕의 만찬 시작'; actions.appendChild(qBtn);
          // 만찬 시작 후 비활성화 처리는 rampageTriggered 상태로 판단
          if (rd.rampageTriggered) {
            qBtn.disabled = true;
            qBtn.textContent = '👑 만찬 진행 중...';
          }
          const qrBtn = mk('button', 'btn btn-ghost btn-full'); qrBtn.id = 'resolve-rampage-btn'; qrBtn.textContent = '만찬 종료 → 탐사대 활동'; actions.appendChild(qrBtn);
        } else if (rd.alienActionTriggered) {
          if (rd.autoMode) {
            const wm = mk('p', ''); wm.textContent = '⚡ 에일리언 활동 완료 — 결과 자동 반영 중...';
            wm.style.cssText = 'font-size:.82rem;color:var(--green);font-weight:600;margin:6px 0;'; actions.appendChild(wm);
          } else {
            const rnBtn = mk('button', 'btn btn-warning btn-full resolve-night-btn'); rnBtn.textContent = '✅ 결과 반영 및 탐사대 활동 시작'; actions.appendChild(rnBtn);
          }
          // Q3: 비상용 버튼 (항상 표시)
          const emergRn = mk('button', 'btn btn-ghost btn-full btn-sm'); emergRn.textContent = '⚙ 비상: 결과 강제 반영';
          emergRn.style.cssText = 'margin-top:4px;font-size:.78rem;color:var(--text3);'; emergRn.className = 'btn btn-ghost btn-full resolve-night-btn';
          actions.appendChild(emergRn);
        } else {
          const taBtn = mk('button', 'btn btn-night btn-full trigger-alien-action-btn'); taBtn.textContent = '🌙 (모두 엎드린 후) 에일리언 활동 시작'; actions.appendChild(taBtn);
        }
      }
      /* 밤: 탐사대 활동 */
      else if (rd.phase === 'night_crew_action') {
        const enBtn = mk('button', 'btn btn-night-red btn-full end-night-btn');
        enBtn.textContent = '🌙 탐사대 활동 완료 → 에일리언 활동 시작'; actions.appendChild(enBtn);
        const emergCrew = mk('button', 'btn btn-ghost btn-full btn-sm end-night-btn');
        emergCrew.textContent = '⚙ 비상: 강제 다음 단계'; emergCrew.style.cssText = 'margin-top:4px;font-size:.78rem;'; actions.appendChild(emergCrew);
      }

      panel.appendChild(actions);

      /* 게임 로그 (게임 진행 열 하단) */
      const logHdr = mk('div', ''); logHdr.style.cssText = 'font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-top:14px;padding-top:10px;border-top:1px solid var(--border);margin-bottom:6px;';
      logHdr.textContent = '게임 로그';
      panel.appendChild(logHdr);

      const logBox = mk('div', 'game-log');
      const seenLogTexts = new Set();
      logBox.innerHTML = (rd.gameLog || []).map(e => {
        const text = typeof e === 'string' ? e : e.text;
        const type = typeof e === 'string' ? 'log' : (e.type || 'log');
        // 의사 보호 관련 로그 중복 방지
        if (text && (text.includes('의학적으로') || text.includes('백신') || text.includes('보호'))) {
          if (seenLogTexts.has(text)) return '';
          seenLogTexts.add(text);
        }
        return '<p class="log-' + type + '">' + esc(text) + '</p>';
      }).filter(Boolean).join('');
      panel.appendChild(logBox);

      /* 진행 가이드 */
      const guide = mk('div', 'guide-box');
      guide.innerHTML = mkGuideText(rd);
      panel.appendChild(guide);
    }

    function mkGuideText(rd) {
      if (rd.pendingAction === 'crisis_roulette') return '<b>[가이드]</b> 위기 상황! 룰렛 시작 버튼을 누르세요.';
      switch (rd.phase) {
        case 'role_reveal': return '<b>[가이드]</b> 역할 확인 완료 후 <b>1일차 회의 시작</b> 클릭.';
        case 'meeting':
          if (rd.ejectionState === 'pending_start') return rd.autoMode ? '<b>[자동]</b> 모둠 선택 완료 시 타이머 자동 시작 → 30초 전 지목 화면 자동 표시.' : '<b>[가이드]</b> 자기소개 후 타이머 작동, 이후 1차 후보 지목 시작.';
          if (rd.ejectionState === 'nominating') return '<b>[가이드]</b> 모니터링 열에서 투표 현황 확인. 완료 시 미니게임 시작 버튼 활성.';
          if (rd.ejectionState === 'minigame_pending') return '<b>[가이드]</b> 후보 지목 완료! 방출 미니게임 시작 버튼 클릭.';
          if (['minigame_active', 'minigame_all_selected'].includes(rd.ejectionState)) return '<b>[가이드]</b> 모니터링 열에서 카드 선택 확인. 전원 선택 완료 시 결과 공개 버튼 활성.';
          return '';
        case 'night_alien_action': return rd.alienActionTriggered ? '<b>[자동]</b> 에일리언 활동 완료 후 결과 자동 반영 대기 중.' : '<b>[가이드]</b> 모두 엎드린 후 에일리언 활동 시작 버튼 클릭.';
        case 'night_crew_action': return '<b>[가이드]</b> 탐사대 활동 완료 후 <b>에일리언 활동 시작</b> 버튼 클릭.';
        case 'escape_sequence': return '<b>[가이드]</b> 관문 단계별 확인 버튼 클릭.';
        default: return '';
      }
    }

    /* ── 모니터링 열 ── */
    function renderColMonitor(panel, code, rd) {
      panel.innerHTML = '<div class="col-header">📊 모니터링</div>';
      let hasContent = false;

      /* 탈출 역할 주장 */
      if (rd.pendingAction === 'escape_role_claim') {
        hasContent = true;
        const rc = rd.claimedRoles || {};
        const living = rd.players.filter(p => p.status === 'alive');
        const claimed = living.filter(p => rc[p.id]).length;
        const t = mk('h4', ''); t.textContent = '🚀 역할 주장 (' + claimed + '/' + living.length + ')'; t.style.margin = '0 0 8px'; panel.appendChild(t);
        living.forEach(p => {
          const row = mk('div', 'monitor-row' + (rc[p.id] ? ' voted' : ''));
          row.innerHTML = '<span>' + esc(p.name) + '</span>'
            + (rc[p.id] ? '<span class="claim-badge">' + esc(rc[p.id]) + '</span>' : '<span style="color:var(--text3);font-size:.78rem;">대기 중...</span>');
          panel.appendChild(row);
        });
      }

      /* 탈출 투표 현황 */
      if (rd.pendingAction === 'escape_survivor_selection') {
        hasContent = true;
        const ev = rd.escapeVotes || {};
        const living = rd.players.filter(p => p.status === 'alive');
        const t = mk('h4', ''); t.textContent = '🗳 탈출 투표 (' + Object.keys(ev).length + '/' + living.length + ')'; t.style.margin = '0 0 8px'; panel.appendChild(t);
        living.forEach(p => {
          const row = mk('div', 'monitor-row' + (ev[p.id] ? ' voted' : ''));
          const vp = ev[p.id] ? rd.players.find(q => q.id === ev[p.id]) : null;
          row.innerHTML = '<span>' + esc(p.name) + '</span>'
            + (vp ? '<span class="claim-badge">▶ ' + esc(vp.name) + '</span>' : '<span style="color:var(--text3);font-size:.78rem;">투표 중...</span>');
          panel.appendChild(row);
        });
      }

      /* 탈출 최종 탑승자 */
      if (rd.pendingAction === 'escape_ready' && rd.escapees && rd.escapees.length > 0) {
        hasContent = true;
        const t = mk('h4', ''); t.textContent = '🛸 최종 탑승자'; t.style.margin = '0 0 8px'; panel.appendChild(t);
        rd.escapees.forEach(p => {
          const row = mk('div', 'monitor-row voted');
          row.innerHTML = '<span>' + esc(p.name) + '</span><span class="claim-badge">' + esc(p.role) + '</span>';
          panel.appendChild(row);
        });
      }

      /* 지목 투표 현황 */
      if (rd.phase === 'meeting' && rd.ejectionState === 'nominating') {
        hasContent = true;
        const alive = rd.players.filter(p => p.status === 'alive' && p.group);
        const gCounts = {};
        alive.forEach(p => gCounts[p.group] = (gCounts[p.group] || 0) + 1);
        const voters = alive.filter(p => gCounts[p.group] > 1);
        let voted = 0;
        if (rd.ejectionVotes) Object.values(rd.ejectionVotes).forEach(gv => voted += Object.keys(gv).length);
        const t = mk('h4', ''); t.textContent = '🗳 지목 투표 (' + voted + '/' + voters.length + ')'; t.style.margin = '0 0 8px'; panel.appendChild(t);
        const vg = mk('div', 'vote-grid');
        voters.forEach(voter => {
          const tid = rd.ejectionVotes?.[voter.group]?.[voter.id];
          const tp = tid ? rd.players.find(p => p.id === tid) : null;
          const row = mk('div', 'monitor-row' + (tid ? ' voted' : ''));
          row.innerHTML = '<b style="font-size:.8rem;">' + esc(voter.name) + '</b>'
            + (tp ? '<span style="font-size:.78rem;color:var(--green);">▶ ' + esc(tp.name) + '</span>' : '<span style="color:var(--text3);font-size:.75rem;">투표 중...</span>');
          vg.appendChild(row);
        });
        panel.appendChild(vg);
      }

      /* 방출 미니게임 현황 */
      if (rd.phase === 'meeting' && ['minigame_active', 'minigame_all_selected'].includes(rd.ejectionState)) {
        const mg = rd.ejectionMinigame;
        if (mg && mg.candidates) {
          hasContent = true;
          const t = mk('h4', ''); t.textContent = '🎮 방출 미니게임 (관리자 전용)'; t.style.margin = '0 0 8px'; panel.appendChild(t);
          mg.candidates.forEach(cId => {
            const cp = rd.players.find(p => p.id === cId);
            const sel = mg.selections ? mg.selections[cId] : undefined;
            const row = mk('div', 'monitor-row' + (sel !== undefined ? ' voted' : ''));
            const ns = mk('strong', ''); ns.textContent = cp ? cp.name : '???'; ns.style.fontSize = '.83rem';
            const cs = mk('span', 'mg-badge');
            if (sel !== undefined) {
              const card = mg.cards ? mg.cards.find(c => c.id === sel) : null;
              if (card && card.content === '방출') { cs.className = 'mg-badge ejection'; cs.textContent = '💀 방출'; }
              else if (card) { cs.className = 'mg-badge survival'; cs.textContent = '💚 생존'; }
              else { cs.className = 'mg-badge pending'; cs.textContent = '선택됨'; }
            } else { cs.className = 'mg-badge pending'; cs.textContent = '선택 중...'; }
            row.appendChild(ns); row.appendChild(cs);
            panel.appendChild(row);
          });
        }
      }

      if (!hasContent) {
        const p = mk('p', ''); p.style.color = 'var(--text3)'; p.style.fontSize = '.83rem';
        p.textContent = '현재 모니터링할 내용이 없습니다.';
        panel.appendChild(p);
      }
    }

    /* ── 페이즈 뱃지 생성 ── */
    function mkPhaseBadge(rd) {
      const el = mk('div', 'phase-badge');
      if (rd.status === 'game_over') { el.classList.add('special'); el.textContent = '🏁 게임 종료 — ' + rd.winner + ' 승리'; }
      else if (rd.phase === 'role_reveal') { el.classList.add('day'); el.textContent = '☀️ ' + rd.day + '일차 — 역할 확인'; }
      else if (rd.phase === 'meeting') {
        el.classList.add('day');
        const sub = { pending_start: '자기소개', nominating: '후보 지목 중', minigame_pending: '미니게임 대기', minigame_active: '미니게임 진행', minigame_all_selected: '결과 공개 대기' };
        el.textContent = '☀️ ' + rd.day + '일차 회의 — ' + (sub[rd.ejectionState] || rd.ejectionState || '');
      }
      else if (rd.phase === 'night_alien_action') {
        el.classList.add('night-alien');
        el.textContent = '🌙 ' + rd.day + '일차 밤 — 🔴 에일리언 활동';
        if (rd.pendingAction === 'queen_rampage') el.textContent += ' / 👑 여왕의 만찬';
      }
      else if (rd.phase === 'night_crew_action') { el.classList.add('night-crew'); el.textContent = '🌙 ' + rd.day + '일차 밤 1단계 — 🟡 탐사대 활동'; }
      else if (rd.phase === 'escape_sequence') { el.classList.add('special'); el.textContent = '🚀 비상탈출 시퀀스 — 관문 ' + ((rd.escapeStep || 0) + 1); }
      else { el.classList.add('day'); el.textContent = rd.day + '일차 ' + rd.phase; }
      return el;
    }

    /* ── 유틸 ── */
    function mk(tag, cls) { const el = document.createElement(tag); if (cls) el.className = cls; return el; }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    /* ══════════════════════════════════════════════
       클릭 핸들러
    ══════════════════════════════════════════════ */
    roomsContainer.addEventListener('click', function (e) {
      const target = e.target;
      const card = target.closest('.room-card');
      if (!card) return;
      const roomCode = card.dataset.code;
      const cl = target.classList;

      /* 대기실 */
      if (cl.contains('kick-btn')) {
        if (confirm('\'' + target.dataset.playerName + '\' 님을 퇴장시키겠습니까?'))
          socket.emit('kickPlayer', { roomCode, playerId: target.dataset.playerId });
      } else if (cl.contains('auto-assign-btn')) {
        const rc = target.dataset.roomCode;
        const inp = document.getElementById('auto-assign-inp-' + rc);
        const rd2 = gameRoomsState[rc];
        const total = parseInt(inp.value) || (rd2 ? rd2.players.length : 0);
        if (isNaN(total) || total < 1) { alert('참가자가 없습니다.'); return; }
        const assigned = autoAssignRoles(total);
        if (!assigned) { alert('배정 실패'); return; }
        let t = 0;
        card.querySelectorAll('.role-row input').forEach(i => { const v = assigned[i.dataset.role] || 0; i.value = v; t += v; });
        const ts = document.getElementById('total-roles-' + rc);
        if (ts) ts.textContent = '총원: ' + t;
      } else if (cl.contains('start-game-btn')) {
        const players = gameRoomsState[roomCode].players;
        if (players.length < 4) { alert('최소 4명이 필요합니다.'); return; }
        const roleSettings = {};
        let totalRoles = 0;
        card.querySelectorAll('.role-row input').forEach(i => {
          const cnt = parseInt(i.value); if (cnt > 0) roleSettings[i.dataset.role] = cnt; totalRoles += cnt || 0;
        });
        if (totalRoles > 0 && totalRoles !== players.length) {
          alert(`⚠️ 역할 합계(${totalRoles}명)와 접속 인원(${players.length}명)이 일치하지 않습니다.\n게임을 시작할 수 없습니다.`);
          return;
        }
        const gc = document.getElementById('group-count-' + roomCode);
        const ps = document.getElementById('mission-preset-select-' + roomCode);
        const ej = document.getElementById('ejection-minigame-toggle-' + roomCode);
        const autoChk = document.getElementById('auto-chk-' + roomCode);
        const autoMt = document.getElementById('auto-mt-' + roomCode);
        const autoAt = document.getElementById('auto-at-' + roomCode);
        /* Q3: 게임 시작 시 자동진행 설정 자동 적용 (별도 저장 버튼 불필요) */
        socket.emit('setAutoMode', {
          roomCode,
          autoMode: autoChk ? autoChk.checked : true,
          meetingTime: autoMt ? parseInt(autoMt.value) : 90,
          alienTime: autoAt ? parseInt(autoAt.value) : 60
        });
        socket.emit('startGame', {
          code: roomCode,
          settings: roleSettings,
          groupCount: parseInt(gc?.value) || 4,
          selectedPreset: ps ? ps.value : '',
          useEjectionMinigame: ej ? ej.checked : true
        });

        /* 게임 진행 */
      } else if (cl.contains('meeting-timer-btn')) {
        socket.emit('startMeetingTimer', roomCode);
      } else if (cl.contains('start-nomination-btn')) {
        const rd2 = gameRoomsState[roomCode];
        const unsel = rd2.players.filter(p => p.status === 'alive' && !p.group);
        if (unsel.length > 0) { alert('모둠 미선택: ' + unsel.map(p => p.name).join(', ')); return; }
        if (confirm('후보 지목 화면을 띄웁니다. 진행할까요?')) socket.emit('startEjectionNomination', { code: roomCode });
      } else if (cl.contains('start-ejection-minigame-btn')) {
        if (confirm('방출 미니게임을 시작합니다.')) socket.emit('startEjectionMinigame', { code: roomCode });
      } else if (cl.contains('resolve-ejection-minigame-btn')) {
        if (confirm('결과를 공개하고 방출자를 확정하시겠습니까?')) socket.emit('resolveEjectionMinigame', { code: roomCode });
      } else if (cl.contains('trigger-rampage-btn')) {
        target.disabled = true;
        target.textContent = '👑 만찬 진행 중...';
        socket.emit('triggerQueenRampage', { code: roomCode });
      } else if (target.id === 'resolve-rampage-btn') {
        socket.emit('resolveQueenRampage', { code: roomCode });
      } else if (cl.contains('eliminate-btn')) {
        if (confirm('이 플레이어를 사망 처리하시겠습니까?'))
          socket.emit('eliminatePlayer', { roomCode, playerId: target.dataset.playerId, cause: 'admin_action' });
      } else if (cl.contains('next-phase-btn')) {
        socket.emit('nextPhase', { code: roomCode, phase: target.dataset.phase, day: target.dataset.day });
      } else if (cl.contains('trigger-alien-action-btn')) {
        socket.emit('triggerAlienAction', { code: roomCode });
      } else if (cl.contains('resolve-night-btn')) {
        socket.emit('resolveNightActions', { code: roomCode });
      } else if (cl.contains('end-night-btn')) {
        socket.emit('endNightAndStartMeeting', { code: roomCode });
      } else if (cl.contains('start-escape-vote-btn')) {
        if (confirm('모든 생존자에게 투표 화면을 띄웁니다.')) socket.emit('startEscapeVote', { code: roomCode });
      } else if (cl.contains('start-escape-sequence-btn')) {
        const rd2 = gameRoomsState[roomCode];
        const ids = (rd2.escapees || []).map(p => p.id);
        if (ids.length !== 4) { alert('오류: 탑승자 4명 필요'); return; }
        socket.emit('startEscapeSequence', { code: roomCode, survivorIds: ids });
      } else if (cl.contains('escape-timer-btn')) {
        socket.emit('startEscapeTimer', roomCode);
        target.textContent = '⏱ 타이머 작동 중...'; target.disabled = true;
      } else if (cl.contains('force-escape-fail-btn')) {
        if (confirm('시간 초과로 탈출 실패 처리하시겠습니까?')) socket.emit('forceEscapeFailure', { code: roomCode });
      } else if (cl.contains('resolve-escape-step-btn')) {
        socket.emit('resolveEscapeStep', { code: roomCode });
      } else if (cl.contains('start-crisis-roulette-btn')) {
        const crisis = gameRoomsState[roomCode]?.crisis;
        const ct = crisis ? '[' + crisis.type + '] ' : '';
        if (confirm(ct + '룰렛을 시작하면 모든 참가자에게 결과가 공개됩니다.')) socket.emit('startCrisisRoulette', { roomCode });
      }
    });
  </script>
</body>

</html>
